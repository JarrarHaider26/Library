apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: library-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jarrarhaider313/Library.git
    targetRevision: main
    path: helm-library
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
