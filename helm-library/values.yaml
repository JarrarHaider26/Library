app:
  name: library-api
  image: ghcr.io/jarrarhaider26/library-api
  tag: "f8e2c846d6642f49197ba8372f8fa115e045b8af"
  pullPolicy: IfNotPresent
  replicas: 1
  secretKey: mysecretkey
  algorithm: HS256
  databaseUrl: postgresql://library_user:library_pass@postgres-service:5432/library_db
  service:
    name: library-api-service
    port: 80
    type: LoadBalancer

postgres:
  name: postgres
  image: postgres
  tag: 15-alpine
  db: library_db
  user: library_user
  password: library_pass
  service:
    name: postgres-service
    port: 5432
    type: ClusterIP
  pvc:
    name: postgres-pvc
    storage: 1Gi
    accessMode: ReadWriteOnce
