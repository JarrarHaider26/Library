apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-rules
  namespace: monitoring
data:
  app-alerts.yml: |
    groups:
      - name: app-alerts
        rules:
          - alert: AppDown
            expr: up{job="kubernetes-pods"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "App is down"
              description: "One of the monitored app targets is down."
